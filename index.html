<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Eagle-Pop Elite 🦅</title>
    <style>
        body { margin: 0; background: #080808; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; margin: 0 auto; background: radial-gradient(circle, #1a1a1a 0%, #080808 100%); }
        #ui { position: absolute; top: 15px; width: 100%; text-align: center; pointer-events: none; z-index: 10; }
        .score { font-size: 28px; font-weight: 900; color: #ccaa44; text-shadow: 0 0 15px rgba(204, 170, 68, 0.6); letter-spacing: 2px; pointer-events: auto; }
        #wallet-bar { position: absolute; bottom: 0; width: 100%; background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(15px); border-top: 2px solid #ccaa44; padding: 20px 0; text-align: center; }
        .tip-btn { background: linear-gradient(135deg, #ccaa44 0%, #f5d76e 100%); color: #000; border: none; padding: 14px 30px; border-radius: 50px; font-weight: 900; text-transform: uppercase; font-size: 13px; cursor: pointer; box-shadow: 0 0 20px rgba(204,170,68,0.4); }
        .addr { font-size: 9px; color: #666; margin-top: 10px; font-family: monospace; word-break: break-all; padding: 0 20px; display: none; }
    </style>
</head>
<body>
<div id="ui"><div class="score" id="scoreHeader">EAGLE-POP: <span id="scoreVal">0</span></div></div>
<canvas id="game"></canvas>
<div id="wallet-bar">
    <button class="tip-btn" onclick="toggleAddr()">⚡ SUPPORT THE BUILDER (SOL)</button>
    <div id="addr" class="addr">GU5dNvMQKoUiVJvZ5HUgrv3CxtrR5ujxfHK2HPT6Z6bV</div>
</div>
<script>
    const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight - 100;

const COLORS = ['#FF3E3E', '#42FF3E', '#3EABFF', '#FFD700'];
const GRID_COLS = 10; 
const BUBBLE_RADIUS = canvas.width / (GRID_COLS * 2);
const GRID_ROWS = 16; 
const LIMIT_LINE = (GRID_ROWS - 3) * BUBBLE_RADIUS * 1.7;

let grid = [];
let score = 0;
let audioCtx = null;
let isGoldenMode = false;
let eggClicks = 0;
let eggTimer = null;
let currentBall = { x: canvas.width/2, y: canvas.height-40, color: COLORS[0], vx:0, vy:0, shooting: false };
let touchX, touchY;

function initAudio() {
    if (audioCtx && audioCtx.state === 'running') return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playPopSound() {
    if(!audioCtx || audioCtx.state !== 'running') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(450, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}

function initGrid() {
    grid = Array.from({ length: GRID_ROWS }, () => Array(GRID_COLS).fill(null));
    for(let r=0; r<6; r++) {
        for(let c=0; c<GRID_COLS; c++) {
            grid[r][c] = { 
                x: (c * BUBBLE_RADIUS * 2) + BUBBLE_RADIUS + (r % 2 === 1 ? BUBBLE_RADIUS : 0),
                y: (r * BUBBLE_RADIUS * 1.7) + BUBBLE_RADIUS,
                color: COLORS[Math.floor(Math.random() * COLORS.length)] 
            };
        }
    }
}
    function drawBubble(x, y, color) {
    ctx.beginPath(); ctx.arc(x, y, BUBBLE_RADIUS - 1.5, 0, Math.PI*2);
    ctx.fillStyle = color; ctx.shadowBlur = 10; ctx.shadowColor = color;
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(x - BUBBLE_RADIUS/3, y - BUBBLE_RADIUS/3, BUBBLE_RADIUS/6, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fill();
}

function snapToGrid() {
    currentBall.shooting = false;
    let r = Math.round((currentBall.y - BUBBLE_RADIUS) / (BUBBLE_RADIUS * 1.7));
    let offsetX = (r % 2 === 1) ? BUBBLE_RADIUS : 0;
    let c = Math.round((currentBall.x - BUBBLE_RADIUS - offsetX) / (BUBBLE_RADIUS * 2));
    r = Math.max(0, Math.min(r, GRID_ROWS-1)); c = Math.max(0, Math.min(c, GRID_COLS-1));
    if (grid[r][c]) r = Math.min(r + 1, GRID_ROWS - 1);
    grid[r][c] = { x: (c * BUBBLE_RADIUS * 2) + BUBBLE_RADIUS + (r % 2 === 1 ? BUBBLE_RADIUS : 0),
                  y: (r * BUBBLE_RADIUS * 1.7) + BUBBLE_RADIUS,
                  color: isGoldenMode ? '#FFD700' : currentBall.color };
    let color = grid[r][c].color; let matches = [[r,c]];
    [[r, c-1], [r, c+1], [r-1, c], [r+1, c]].forEach(n => {
        if(grid[n[0]] && grid[n[0]][n[1]] && grid[n[0]][n[1]].color === color) matches.push([n[0], n[1]]);
    });
    if(matches.length >= 3) {
        matches.forEach(m => grid[m[0]][m[1]] = null);
        score += matches.length * 20; scoreEl.innerText = score; playPopSound();
    }
    if(grid[r][c] && grid[r][c].y > LIMIT_LINE) { alert("GAME OVER!"); score=0; scoreEl.innerText=0; initGrid(); }
    currentBall = { x: canvas.width/2, y: canvas.height-40, color: isGoldenMode ? '#FFD700' : COLORS[Math.floor(Math.random()*COLORS.length)], vx:0, vy:0, shooting: false };
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(currentBall.shooting) {
        currentBall.x += currentBall.vx; currentBall.y += currentBall.vy;
        if(currentBall.x < BUBBLE_RADIUS || currentBall.x > canvas.width - BUBBLE_RADIUS) currentBall.vx *= -1;
        let hit = false;
        for(let r=0; r<GRID_ROWS; r++) { for(let c=0; c<GRID_COLS; c++) {
            if(grid[r][c] && Math.hypot(currentBall.x - grid[r][c].x, currentBall.y - grid[r][c].y) < BUBBLE_RADIUS * 1.5) { hit = true; break; }
        } if(hit) break; }
        if(hit || currentBall.y < BUBBLE_RADIUS) snapToGrid();
    }
    for(let r=0; r<GRID_ROWS; r++) { for(let c=0; c<GRID_COLS; c++) { if(grid[r][c]) drawBubble(grid[r][c].x, grid[r][c].y, grid[r][c].color); } }
    drawBubble(currentBall.x, currentBall.y, currentBall.color);
    requestAnimationFrame(draw);
}

document.getElementById('scoreHeader').addEventListener('touchstart', () => {
    eggClicks++; clearTimeout(eggTimer);
    if(eggClicks >= 5) {
        isGoldenMode = true; document.getElementById('scoreHeader').style.color = '#FFD700';
        setTimeout(() => { isGoldenMode = false; document.getElementById('scoreHeader').style.color = '#ccaa44'; }, 15000);
    }
    eggTimer = setTimeout(() => eggClicks = 0, 2000);
});

canvas.addEventListener('touchstart', (e) => { initAudio(); touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; });
canvas.addEventListener('touchend', () => {
    if(!currentBall.shooting) {
        let dx = touchX - (canvas.width/2), dy = touchY - (canvas.height-40);
        let d = Math.hypot(dx, dy); currentBall.vx = (dx/d)*15; currentBall.vy = (dy/d)*15;
        currentBall.shooting = true;
    }
});

function toggleAddr() { const a = document.getElementById('addr'); a.style.display = (a.style.display==='block')?'none':'block'; }
initGrid(); draw();
</script>
</body>
</html>
