<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight - 100;

const COLORS = ['#FF3E3E', '#42FF3E', '#3EABFF', '#FFD700'];
const GRID_COLS = 10; // Plus de colonnes = bulles plus petites
const BUBBLE_RADIUS = canvas.width / (GRID_COLS * 2);
const GRID_ROWS = 16; // On ajoute des lignes pour compenser la petite taille
const LIMIT_LINE = (GRID_ROWS - 3) * BUBBLE_RADIUS * 1.7;

let grid = [];
let score = 0;
let audioCtx = null;

function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    playZenNote();
}

function playZenNote() {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220 + Math.random() * 5, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 5);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 5);
    setTimeout(playZenNote, 4000 + Math.random() * 2000);
}

function playPopSound() {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(500, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.08);
}

function initGrid() {
    grid = Array.from({ length: GRID_ROWS }, () => Array(GRID_COLS).fill(null));
    for(let r=0; r<6; r++) { // Un peu plus de bulles au départ
        for(let c=0; c<GRID_COLS; c++) {
            grid[r][c] = createBubble(r, c, COLORS[Math.floor(Math.random() * COLORS.length)]);
        }
    }
}

function createBubble(r, c, color) {
    return {
        x: (c * BUBBLE_RADIUS * 2) + BUBBLE_RADIUS + (r % 2 === 1 ? BUBBLE_RADIUS : 0),
        y: (r * BUBBLE_RADIUS * 1.7) + BUBBLE_RADIUS,
        color: color, active: true
    };
}

let currentBall = { x: canvas.width/2, y: canvas.height-40, color: COLORS[0], vx:0, vy:0, shooting: false };

function drawBubble(x, y, color) {
    ctx.beginPath();
    ctx.arc(x, y, BUBBLE_RADIUS - 1.5, 0, Math.PI*2);
    ctx.fillStyle = color;
    ctx.shadowBlur = 12; ctx.shadowColor = color;
    ctx.fill(); ctx.shadowBlur = 0;
    // Petit éclat brillant plus discret
    ctx.beginPath();
    ctx.arc(x - BUBBLE_RADIUS/3.5, y - BUBBLE_RADIUS/3.5, BUBBLE_RADIUS/6, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fill();
}

function handleMatch(r, c) {
    let target = grid[r][c].color;
    let matches = [];
    let queue = [[r,c]], visited = new Set([`${r},${c}`]);

    while(queue.length > 0) {
        let [currR, currC] = queue.shift();
        matches.push([currR, currC]);
        getNeighbors(currR, currC).forEach(([nr, nc]) => {
            if(grid[nr] && grid[nr][nc] && grid[nr][nc].color === target && !visited.has(`${nr},${nc}`)) {
                visited.add(`${nr},${nc}`); queue.push([nr, nc]);
            }
        });
    }

    if(matches.length >= 3) {
        matches.forEach(([mr, mc]) => grid[mr][mc] = null);
        score += matches.length * 15;
        scoreEl.innerText = score;
        playPopSound();
        dropFloating();
    }
}

function dropFloating() {
    let connected = new Set();
    let queue = [];
    for(let c=0; c<GRID_COLS; c++) { if(grid[0][c]) { connected.add(`0,${c}`); queue.push([0, c]); } }
    while(queue.length > 0) {
        let [currR, currC] = queue.shift();
        getNeighbors(currR, currC).forEach(([nr, nc]) => {
            if(grid[nr] && grid[nr][nc] && !connected.has(`${nr},${nc}`)) {
                connected.add(`${nr},${nc}`); queue.push([nr, nc]);
            }
        });
    }
    for(let r=0; r<GRID_ROWS; r++) {
        for(let c=0; c<GRID_COLS; c++) {
            if(grid[r][c] && !connected.has(`${r},${c}`)) { grid[r][c] = null; score += 25; }
        }
    }
    scoreEl.innerText = score;
}

function getNeighbors(r, c) {
    let offset = (r % 2 === 1) ? 1 : -1;
    let n = [[r, c-1], [r, c+1], [r-1, c], [r+1, c], [r-1, c+offset], [r+1, c+offset]];
    return n.filter(([nr, nc]) => nr >= 0 && nr < GRID_ROWS && nc >= 0 && nc < GRID_COLS);
}

function snapToGrid() {
    currentBall.shooting = false;
    let r = Math.round((currentBall.y - BUBBLE_RADIUS) / (BUBBLE_RADIUS * 1.7));
    let offsetX = (r % 2 === 1) ? BUBBLE_RADIUS : 0;
    let c = Math.round((currentBall.x - BUBBLE_RADIUS - offsetX) / (BUBBLE_RADIUS * 2));
    r = Math.max(0, Math.min(r, GRID_ROWS-1));
    c = Math.max(0, Math.min(c, GRID_COLS-1));

    grid[r][c] = createBubble(r, c, currentBall.color);
    if(grid[r][c].y > LIMIT_LINE) {
        alert("GAME OVER! Score: " + score);
        initGrid(); score = 0; scoreEl.innerText = 0;
    } else {
        handleMatch(r, c);
    }
    resetShooter();
}

function resetShooter() {
    currentBall = { x: canvas.width/2, y: canvas.height-40, color: COLORS[Math.floor(Math.random() * COLORS.length)], vx:0, vy:0, shooting: false };
}

function update() {
    if(currentBall.shooting) {
        currentBall.x += currentBall.vx; currentBall.y += currentBall.vy;
        if(currentBall.x < BUBBLE_RADIUS || currentBall.x > canvas.width - BUBBLE_RADIUS) currentBall.vx *= -1;
        for(let r=0; r<GRID_ROWS; r++) {
            for(let c=0; c<GRID_COLS; c++) {
                if(grid[r][c] && Math.hypot(currentBall.x - grid[r][c].x, currentBall.y - grid[r][c].y) < BUBBLE_RADIUS * 1.4) {
                    snapToGrid(); return;
                }
            }
        }
        if(currentBall.y < BUBBLE_RADIUS) snapToGrid();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    update();
    
    // Ligne limite de danger plus fine
    ctx.strokeStyle = 'rgba(255, 62, 62, 0.15)';
    ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(0, LIMIT_LINE + BUBBLE_RADIUS); ctx.lineTo(canvas.width, LIMIT_LINE + BUBBLE_RADIUS); ctx.stroke();
    ctx.setLineDash([]);
    
    for(let r=0; r<GRID_ROWS; r++) {
        for(let c=0; c<GRID_COLS; c++) {
            if(grid[r][c]) drawBubble(grid[r][c].x, grid[r][c].y, grid[r][c].color);
        }
    }
    drawBubble(currentBall.x, currentBall.y, currentBall.color);
    requestAnimationFrame(draw);
}

let touchX, touchY;
canvas.addEventListener('touchstart', (e) => { initAudio(); touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; });
canvas.addEventListener('touchmove', (e) => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; });
canvas.addEventListener('touchend', () => {
    if(!currentBall.shooting) {
        let dx = touchX - (canvas.width/2), dy = touchY - (canvas.height-40);
        let dist = Math.hypot(dx, dy);
        currentBall.vx = (dx / dist) * 16; currentBall.vy = (dy / dist) * 16;
        currentBall.shooting = true;
    }
});

function toggleAddr() { const a = document.getElementById('addr'); a.style.display = (a.style.display === 'block') ? 'none' : 'block'; }
initGrid();
draw();
</script>
